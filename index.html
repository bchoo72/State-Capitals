<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>U.S. State Capitals</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f4f4f7;
  color: #111;

  user-select: none;
  -webkit-user-select: none;
}

button {
  font-family: inherit;
  cursor: pointer;
}


/* -------------------- */
/* SCREENS              */
/* -------------------- */

.screen {
  display: none;

  width: 100%;
  height: 100%;

  padding:
    max(24px, env(safe-area-inset-top))
    22px
    max(24px, env(safe-area-inset-bottom));
}

.screen.active {
  display: flex;
}


/* -------------------- */
/* HOME SCREEN          */
/* -------------------- */

#homeScreen {
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;
}

.home-title {
  font-size: 38px;
  font-weight: 800;

  margin-bottom: 40px;
}

.tap-start {
  font-size: 27px;
  font-weight: 650;

  padding: 35px;

  width: 100%;
  max-width: 500px;

  cursor: pointer;
}

.choose-button {
  margin-top: 30px;

  padding: 15px 26px;

  border: none;
  border-radius: 14px;

  background: white;

  font-size: 18px;
  font-weight: 650;

  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.selected-count {
  margin-top: 14px;

  font-size: 15px;
  color: #666;
}


/* -------------------- */
/* STUDY SCREEN         */
/* -------------------- */

#studyScreen {
  flex-direction: column;

  align-items: center;

  position: relative;
}

.counter {
  width: 100%;

  text-align: center;

  font-size: 18px;

  color: #666;

  padding-top: 10px;

  pointer-events: none;
}


/* This is the large tappable area */

.study-tap-area {
  flex: 1;

  width: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  cursor: pointer;
}

.state-name {
  font-size: clamp(40px, 11vw, 68px);

  font-weight: 800;

  line-height: 1.1;

  padding-left: 10px;
  padding-right: 10px;
}

.capital-name {
  font-size: clamp(30px, 8vw, 48px);

  font-weight: 500;

  margin-top: 25px;

  min-height: 60px;

  color: #555;
}

.tap-hint {
  margin-top: 30px;

  font-size: 15px;

  color: #999;
}


/* -------------------- */
/* NAVIGATION BUTTONS   */
/* -------------------- */

.nav {
  width: 100%;
  max-width: 600px;

  padding-bottom: 6px;
}

.nav-row {
  width: 100%;

  display: flex;

  gap: 12px;
}

.nav button {
  border: none;

  border-radius: 14px;

  background: white;

  padding: 16px 8px;

  font-size: 17px;
  font-weight: 650;

  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.nav-row button {
  flex: 1;
}

.home-button {
  width: 100%;

  margin-top: 12px;

  background: #e3e3e8 !important;
}

.nav button:disabled {
  opacity: .35;
}


/* -------------------- */
/* CHOOSE STATES SCREEN */
/* -------------------- */

#selectionScreen {
  flex-direction: column;

  overflow-y: auto;

  -webkit-overflow-scrolling: touch;
}

.selection-header {
  position: sticky;

  top: 0;

  background: #f4f4f7;

  padding-bottom: 12px;

  z-index: 10;
}

.selection-title {
  font-size: 30px;
  font-weight: 800;

  margin: 0 0 16px;
}

.selection-actions {
  display: flex;

  gap: 10px;
}

.selection-actions button {
  flex: 1;

  padding: 12px;

  border: none;
  border-radius: 12px;

  background: white;

  font-size: 16px;
  font-weight: 650;
}

.state-list {
  display: grid;

  grid-template-columns: 1fr;

  gap: 8px;

  padding-bottom: 110px;
}

.state-option {
  background: white;

  border-radius: 12px;

  padding: 15px;

  display: flex;

  align-items: center;

  gap: 14px;

  font-size: 18px;
}

.state-option input {
  width: 23px;
  height: 23px;
}

.done-button {
  position: fixed;

  left: 22px;
  right: 22px;

  bottom: max(22px, env(safe-area-inset-bottom));

  padding: 16px;

  border: none;
  border-radius: 14px;

  font-size: 18px;
  font-weight: 700;

  background: #111;

  color: white;
}


/* -------------------- */
/* PORTRAIT ONLY        */
/* -------------------- */

@media (orientation: landscape) {

  body::before {
    content: "Please rotate your phone to portrait mode.";

    position: fixed;

    inset: 0;

    background: #f4f4f7;

    z-index: 99999;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 40px;

    text-align: center;

    font-size: 24px;
    font-weight: 700;
  }

}

</style>
</head>


<body>


<!-- ================================= -->
<!-- HOME SCREEN                       -->
<!-- ================================= -->

<div id="homeScreen" class="screen active">

  <div class="home-title">
    U.S. State Capitals
  </div>

  <div class="tap-start" id="startArea">
    Tap to Start
  </div>

  <button
    class="choose-button"
    id="chooseStates"
  >
    Choose States
  </button>

  <div
    class="selected-count"
    id="selectedCount"
  ></div>

</div>



<!-- ================================= -->
<!-- STUDY SCREEN                      -->
<!-- ================================= -->

<div id="studyScreen" class="screen">

  <div
    class="counter"
    id="counter"
  ></div>


  <!--
       TAP THIS AREA:

       First tap = reveal capital
       Second tap = next state
  -->

  <div
    class="study-tap-area"
    id="studyTapArea"
  >

    <div
      class="state-name"
      id="stateName"
    ></div>


    <div
      class="capital-name"
      id="capitalName"
    ></div>


    <div
      class="tap-hint"
      id="tapHint"
    >
      Tap to reveal capital
    </div>

  </div>



  <!-- BUTTONS ONLY APPEAR AFTER START -->

  <div class="nav">

    <div class="nav-row">

      <button id="previousButton">
        ◀ Previous
      </button>

      <button id="nextButton">
        Next ▶
      </button>

    </div>


    <button
      class="home-button"
      id="homeButton"
    >
      Home
    </button>

  </div>

</div>



<!-- ================================= -->
<!-- CHOOSE STATES SCREEN              -->
<!-- ================================= -->

<div id="selectionScreen" class="screen">


  <div class="selection-header">

    <div class="selection-title">
      Choose States
    </div>


    <div class="selection-actions">

      <button id="selectAll">
        Select All
      </button>

      <button id="clearAll">
        Clear All
      </button>

    </div>

  </div>


  <div
    class="state-list"
    id="stateList"
  ></div>


  <button
    class="done-button"
    id="doneSelection"
  >
    Done
  </button>


</div>



<script>

/* ================================= */
/* STATES AND CAPITALS               */
/* ================================= */

const states = [

  ["Alabama", "Montgomery"],
  ["Alaska", "Juneau"],
  ["Arizona", "Phoenix"],
  ["Arkansas", "Little Rock"],
  ["California", "Sacramento"],
  ["Colorado", "Denver"],
  ["Connecticut", "Hartford"],
  ["Delaware", "Dover"],
  ["Florida", "Tallahassee"],
  ["Georgia", "Atlanta"],
  ["Hawaii", "Honolulu"],
  ["Idaho", "Boise"],
  ["Illinois", "Springfield"],
  ["Indiana", "Indianapolis"],
  ["Iowa", "Des Moines"],
  ["Kansas", "Topeka"],
  ["Kentucky", "Frankfort"],
  ["Louisiana", "Baton Rouge"],
  ["Maine", "Augusta"],
  ["Maryland", "Annapolis"],
  ["Massachusetts", "Boston"],
  ["Michigan", "Lansing"],
  ["Minnesota", "Saint Paul"],
  ["Mississippi", "Jackson"],
  ["Missouri", "Jefferson City"],
  ["Montana", "Helena"],
  ["Nebraska", "Lincoln"],
  ["Nevada", "Carson City"],
  ["New Hampshire", "Concord"],
  ["New Jersey", "Trenton"],
  ["New Mexico", "Santa Fe"],
  ["New York", "Albany"],
  ["North Carolina", "Raleigh"],
  ["North Dakota", "Bismarck"],
  ["Ohio", "Columbus"],
  ["Oklahoma", "Oklahoma City"],
  ["Oregon", "Salem"],
  ["Pennsylvania", "Harrisburg"],
  ["Rhode Island", "Providence"],
  ["South Carolina", "Columbia"],
  ["South Dakota", "Pierre"],
  ["Tennessee", "Nashville"],
  ["Texas", "Austin"],
  ["Utah", "Salt Lake City"],
  ["Vermont", "Montpelier"],
  ["Virginia", "Richmond"],
  ["Washington", "Olympia"],
  ["West Virginia", "Charleston"],
  ["Wisconsin", "Madison"],
  ["Wyoming", "Cheyenne"]

];



/* ================================= */
/* VARIABLES                         */
/* ================================= */

let selectedStates = [...states];

let studyOrder = [];

let currentIndex = 0;

let capitalVisible = false;



/* ================================= */
/* ELEMENTS                          */
/* ================================= */

const homeScreen =
  document.getElementById("homeScreen");

const studyScreen =
  document.getElementById("studyScreen");

const selectionScreen =
  document.getElementById("selectionScreen");


const stateName =
  document.getElementById("stateName");

const capitalName =
  document.getElementById("capitalName");

const counter =
  document.getElementById("counter");

const tapHint =
  document.getElementById("tapHint");

const studyTapArea =
  document.getElementById("studyTapArea");


const stateList =
  document.getElementById("stateList");

const selectedCount =
  document.getElementById("selectedCount");



/* ================================= */
/* SHOW SCREEN                       */
/* ================================= */

function showScreen(screen) {

  document
    .querySelectorAll(".screen")
    .forEach(function(s) {

      s.classList.remove("active");

    });


  screen.classList.add("active");

}



/* ================================= */
/* RANDOMIZE STATES                  */
/* ================================= */

function shuffle(array) {

  const copy = [...array];


  for (
    let i = copy.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] = [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}



/* ================================= */
/* SELECTED STATE COUNT              */
/* ================================= */

function updateSelectedCount() {

  selectedCount.textContent =
    selectedStates.length +
    " of 50 states selected";

}



/* ================================= */
/* START STUDY                       */
/* ================================= */

function startStudy() {

  if (selectedStates.length === 0) {

    alert(
      "Please select at least one state."
    );

    return;

  }


  studyOrder =
    shuffle(selectedStates);


  currentIndex = 0;

  capitalVisible = false;


  showScreen(studyScreen);


  displayState();

}



/* ================================= */
/* DISPLAY CURRENT STATE             */
/* ================================= */

function displayState() {

  if (studyOrder.length === 0) {
    return;
  }


  const item =
    studyOrder[currentIndex];


  stateName.textContent =
    item[0];


  if (capitalVisible) {

    capitalName.textContent =
      item[1];

    tapHint.textContent =
      currentIndex === studyOrder.length - 1
        ? "Tap to finish"
        : "Tap for next state";

  }

  else {

    capitalName.textContent = "";

    tapHint.textContent =
      "Tap to reveal capital";

  }


  counter.textContent =
    (currentIndex + 1) +
    " of " +
    studyOrder.length;


  document
    .getElementById("previousButton")
    .disabled =
      currentIndex === 0;


  document
    .getElementById("nextButton")
    .disabled =
      currentIndex ===
      studyOrder.length - 1;

}



/* ================================= */
/* MAIN TAP BEHAVIOR                 */
/* ================================= */

function handleStudyTap() {

  /*
     FIRST TAP:
     reveal capital
  */

  if (!capitalVisible) {

    capitalVisible = true;

    displayState();

    return;

  }


  /*
     SECOND TAP:
     move to next state
  */

  if (
    currentIndex <
    studyOrder.length - 1
  ) {

    currentIndex++;

    capitalVisible = false;

    displayState();

  }

  else {

    /*
       If you're on the final state
       and tap after revealing it,
       return to Home.
    */

    showScreen(homeScreen);

  }

}



/* ================================= */
/* NEXT BUTTON                       */
/* ================================= */

function nextState() {

  if (
    currentIndex <
    studyOrder.length - 1
  ) {

    currentIndex++;

    capitalVisible = false;

    displayState();

  }

}



/* ================================= */
/* PREVIOUS BUTTON                   */
/* ================================= */

function previousState() {

  if (currentIndex > 0) {

    currentIndex--;

    capitalVisible = false;

    displayState();

  }

}



/* ================================= */
/* BUILD STATE SELECTION LIST        */
/* ================================= */

function buildStateSelection() {

  stateList.innerHTML = "";


  states.forEach(
    function(item, index) {

      const label =
        document.createElement("label");


      label.className =
        "state-option";


      const checkbox =
        document.createElement("input");


      checkbox.type =
        "checkbox";


      checkbox.dataset.index =
        index;


      checkbox.checked =
        selectedStates.some(
          function(state) {

            return (
              state[0] === item[0]
            );

          }
        );


      const text =
        document.createElement("span");


      text.textContent =
        item[0];


      label.appendChild(
        checkbox
      );


      label.appendChild(
        text
      );


      stateList.appendChild(
        label
      );

    }
  );

}



/* ================================= */
/* SAVE STATE SELECTION              */
/* ================================= */

function saveSelection() {

  const checkboxes =
    stateList.querySelectorAll(
      "input[type='checkbox']"
    );


  const newSelection = [];


  checkboxes.forEach(
    function(box) {

      if (box.checked) {

        newSelection.push(
          states[
            Number(
              box.dataset.index
            )
          ]
        );

      }

    }
  );


  if (
    newSelection.length === 0
  ) {

    alert(
      "Please select at least one state."
    );

    return;

  }


  selectedStates =
    newSelection;


  updateSelectedCount();


  showScreen(homeScreen);

}



/* ================================= */
/* START                             */
/* ================================= */

document
  .getElementById("startArea")
  .addEventListener(
    "click",
    startStudy
  );



/* ================================= */
/* TAP STUDY SCREEN                  */
/* ================================= */

studyTapArea
  .addEventListener(
    "click",
    handleStudyTap
  );



/* ================================= */
/* NAVIGATION BUTTONS                */
/* ================================= */

document
  .getElementById("nextButton")
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      nextState();

    }
  );


document
  .getElementById("previousButton")
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      previousState();

    }
  );


document
  .getElementById("homeButton")
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      showScreen(
        homeScreen
      );

    }
  );



/* ================================= */
/* CHOOSE STATES                     */
/* ================================= */

document
  .getElementById("chooseStates")
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      buildStateSelection();

      showScreen(
        selectionScreen
      );

    }
  );



/* ================================= */
/* SELECT ALL                        */
/* ================================= */

document
  .getElementById("selectAll")
  .addEventListener(
    "click",
    function() {

      stateList
        .querySelectorAll(
          "input"
        )
        .forEach(
          function(box) {

            box.checked = true;

          }
        );

    }
  );



/* ================================= */
/* CLEAR ALL                         */
/* ================================= */

document
  .getElementById("clearAll")
  .addEventListener(
    "click",
    function() {

      stateList
        .querySelectorAll(
          "input"
        )
        .forEach(
          function(box) {

            box.checked = false;

          }
        );

    }
  );



/* ================================= */
/* DONE CHOOSING STATES              */
/* ================================= */

document
  .getElementById("doneSelection")
  .addEventListener(
    "click",
    saveSelection
  );



/* ================================= */
/* INITIALIZE                        */
/* ================================= */

updateSelectedCount();

</script>

</body>
</html>
