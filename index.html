<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>U.S. State Capitals</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f4f4f7;
  color: #111;
  user-select: none;
  -webkit-user-select: none;
}

button {
  font-family: inherit;
}

.screen {
  display: none;
  width: 100%;
  height: 100%;
  padding:
    max(24px, env(safe-area-inset-top))
    22px
    max(24px, env(safe-area-inset-bottom));
}

.screen.active {
  display: flex;
}

/* HOME */

#homeScreen {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.home-title {
  font-size: 38px;
  font-weight: 800;
  margin-bottom: 16px;
}

.tap-start {
  font-size: 25px;
  font-weight: 600;
  padding: 30px;
  width: 100%;
  max-width: 500px;
  cursor: pointer;
}

.choose-button {
  margin-top: 28px;
  padding: 14px 24px;
  border: none;
  border-radius: 14px;
  background: #fff;
  font-size: 18px;
  font-weight: 600;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
  cursor: pointer;
}

.selected-count {
  margin-top: 12px;
  color: #666;
  font-size: 15px;
}

/* STUDY */

#studyScreen {
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}

.counter {
  width: 100%;
  text-align: center;
  font-size: 17px;
  color: #666;
  padding-top: 10px;
}

.card-area {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
}

.state-name {
  font-size: clamp(38px, 10vw, 65px);
  font-weight: 800;
  line-height: 1.1;
}

.capital-name {
  font-size: clamp(28px, 8vw, 48px);
  font-weight: 500;
  margin-top: 24px;
  min-height: 58px;
  color: #555;
}

.tap-hint {
  margin-top: 28px;
  font-size: 15px;
  color: #999;
}

.nav {
  width: 100%;
  max-width: 600px;
  padding-bottom: 10px;
}

.nav-row {
  display: flex;
  gap: 12px;
  width: 100%;
}

.nav button {
  flex: 1;
  padding: 16px 8px;
  border: none;
  border-radius: 14px;
  background: #fff;
  font-size: 17px;
  font-weight: 650;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  cursor: pointer;
}

.home-button {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #e3e3e8;
  font-size: 17px;
  font-weight: 650;
  cursor: pointer;
}

/* STATE SELECTION */

#selectionScreen {
  flex-direction: column;
  overflow-y: auto;
}

.selection-header {
  position: sticky;
  top: 0;
  background: #f4f4f7;
  padding-bottom: 12px;
  z-index: 2;
}

.selection-title {
  font-size: 30px;
  font-weight: 800;
  margin: 0 0 14px;
}

.selection-actions {
  display: flex;
  gap: 10px;
}

.selection-actions button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #fff;
  font-size: 16px;
  font-weight: 600;
}

.state-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  padding-bottom: 100px;
}

.state-option {
  background: #fff;
  border-radius: 12px;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 18px;
}

.state-option input {
  width: 22px;
  height: 22px;
}

.done-button {
  position: fixed;
  left: 22px;
  right: 22px;
  bottom: max(22px, env(safe-area-inset-bottom));
  padding: 16px;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: 700;
  background: #111;
  color: #fff;
}

/* Helps discourage landscape use */
@media (orientation: landscape) {
  body::before {
    content: "Please rotate your phone to portrait mode.";
    position: fixed;
    inset: 0;
    background: #f4f4f7;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
  }
}
</style>
</head>

<body>

<!-- HOME -->
<div id="homeScreen" class="screen active">

  <div class="home-title">U.S. State Capitals</div>

  <div class="tap-start" id="startArea">
    Tap to Start
  </div>

  <button class="choose-button" id="chooseStates">
    Choose States
  </button>

  <div class="selected-count" id="selectedCount"></div>

</div>


<!-- STUDY -->
<div id="studyScreen" class="screen">

  <div class="counter" id="counter"></div>

  <div class="card-area" id="cardArea">

    <div class="state-name" id="stateName"></div>

    <div class="capital-name" id="capitalName"></div>

    <div class="tap-hint" id="tapHint">
      Tap to reveal capital
    </div>

  </div>

  <div class="nav">

    <div class="nav-row">

      <button id="previousButton">
        ◀ Previous
      </button>

      <button id="nextButton">
        Next ▶
      </button>

    </div>

    <button class="home-button" id="homeButton">
      Home
    </button>

  </div>

</div>


<!-- STATE SELECTION -->
<div id="selectionScreen" class="screen">

  <div class="selection-header">

    <div class="selection-title">
      Choose States
    </div>

    <div class="selection-actions">

      <button id="selectAll">
        Select All
      </button>

      <button id="clearAll">
        Clear All
      </button>

    </div>

  </div>

  <div class="state-list" id="stateList"></div>

  <button class="done-button" id="doneSelection">
    Done
  </button>

</div>


<script>

const states = [
  ["Alabama", "Montgomery"],
  ["Alaska", "Juneau"],
  ["Arizona", "Phoenix"],
  ["Arkansas", "Little Rock"],
  ["California", "Sacramento"],
  ["Colorado", "Denver"],
  ["Connecticut", "Hartford"],
  ["Delaware", "Dover"],
  ["Florida", "Tallahassee"],
  ["Georgia", "Atlanta"],
  ["Hawaii", "Honolulu"],
  ["Idaho", "Boise"],
  ["Illinois", "Springfield"],
  ["Indiana", "Indianapolis"],
  ["Iowa", "Des Moines"],
  ["Kansas", "Topeka"],
  ["Kentucky", "Frankfort"],
  ["Louisiana", "Baton Rouge"],
  ["Maine", "Augusta"],
  ["Maryland", "Annapolis"],
  ["Massachusetts", "Boston"],
  ["Michigan", "Lansing"],
  ["Minnesota", "Saint Paul"],
  ["Mississippi", "Jackson"],
  ["Missouri", "Jefferson City"],
  ["Montana", "Helena"],
  ["Nebraska", "Lincoln"],
  ["Nevada", "Carson City"],
  ["New Hampshire", "Concord"],
  ["New Jersey", "Trenton"],
  ["New Mexico", "Santa Fe"],
  ["New York", "Albany"],
  ["North Carolina", "Raleigh"],
  ["North Dakota", "Bismarck"],
  ["Ohio", "Columbus"],
  ["Oklahoma", "Oklahoma City"],
  ["Oregon", "Salem"],
  ["Pennsylvania", "Harrisburg"],
  ["Rhode Island", "Providence"],
  ["South Carolina", "Columbia"],
  ["South Dakota", "Pierre"],
  ["Tennessee", "Nashville"],
  ["Texas", "Austin"],
  ["Utah", "Salt Lake City"],
  ["Vermont", "Montpelier"],
  ["Virginia", "Richmond"],
  ["Washington", "Olympia"],
  ["West Virginia", "Charleston"],
  ["Wisconsin", "Madison"],
  ["Wyoming", "Cheyenne"]
];

let selectedStates = [...states];
let studyOrder = [];
let currentIndex = 0;
let capitalVisible = false;

const homeScreen = document.getElementById("homeScreen");
const studyScreen = document.getElementById("studyScreen");
const selectionScreen = document.getElementById("selectionScreen");

const stateName = document.getElementById("stateName");
const capitalName = document.getElementById("capitalName");
const counter = document.getElementById("counter");
const tapHint = document.getElementById("tapHint");
const stateList = document.getElementById("stateList");
const selectedCount = document.getElementById("selectedCount");


function showScreen(screen) {
  document.querySelectorAll(".screen").forEach(s => {
    s.classList.remove("active");
  });

  screen.classList.add("active");
}


function shuffle(array) {

  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [copy[i], copy[j]] = [copy[j], copy[i]];

  }

  return copy;
}


function updateSelectedCount() {

  selectedCount.textContent =
    `${selectedStates.length} of 50 states selected`;

}


function startStudy() {

  if (selectedStates.length === 0) {
    alert("Please select at least one state.");
    return;
  }

  studyOrder = shuffle(selectedStates);

  currentIndex = 0;

  capitalVisible = false;

  showScreen(studyScreen);

  displayState();
}


function displayState() {

  if (studyOrder.length === 0) return;

  const item = studyOrder[currentIndex];

  stateName.textContent = item[0];

  capitalName.textContent =
    capitalVisible ? item[1] : "";

  tapHint.textContent =
    capitalVisible
      ? "Tap to hide capital"
      : "Tap to reveal capital";

  counter.textContent =
    `${currentIndex + 1} of ${studyOrder.length}`;

  document.getElementById("previousButton").disabled =
    currentIndex === 0;

  document.getElementById("nextButton").disabled =
    currentIndex === studyOrder.length - 1;
}


function toggleCapital() {

  capitalVisible = !capitalVisible;

  displayState();
}


function nextState() {

  if (currentIndex < studyOrder.length - 1) {

    currentIndex++;

    capitalVisible = false;

    displayState();

  }

}


function previousState() {

  if (currentIndex > 0) {

    currentIndex--;

    capitalVisible = false;

    displayState();

  }

}


function buildStateSelection() {

  stateList.innerHTML = "";

  states.forEach((item, index) => {

    const label = document.createElement("label");

    label.className = "state-option";

    const checkbox = document.createElement("input");

    checkbox.type = "checkbox";

    checkbox.dataset.index = index;

    checkbox.checked =
      selectedStates.some(state => state[0] === item[0]);

    const text = document.createElement("span");

    text.textContent = item[0];

    label.appendChild(checkbox);

    label.appendChild(text);

    stateList.appendChild(label);

  });

}


function saveSelection() {

  const checkboxes =
    stateList.querySelectorAll("input[type='checkbox']");

  selectedStates = [];

  checkboxes.forEach(box => {

    if (box.checked) {

      selectedStates.push(states[Number(box.dataset.index)]);

    }

  });

  if (selectedStates.length === 0) {

    alert("Please select at least one state.");

    return;

  }

  updateSelectedCount();

  showScreen(homeScreen);
}


document.getElementById("startArea")
  .addEventListener("click", startStudy);


document.getElementById("cardArea")
  .addEventListener("click", toggleCapital);


document.getElementById("nextButton")
  .addEventListener("click", nextState);


document.getElementById("previousButton")
  .addEventListener("click", previousState);


document.getElementById("homeButton")
  .addEventListener("click", () => {

    showScreen(homeScreen);

  });


document.getElementById("chooseStates")
  .addEventListener("click", () => {

    buildStateSelection();

    showScreen(selectionScreen);

  });


document.getElementById("selectAll")
  .addEventListener("click", () => {

    stateList
      .querySelectorAll("input")
      .forEach(box => box.checked = true);

  });


document.getElementById("clearAll")
  .addEventListener("click", () => {

    stateList
      .querySelectorAll("input")
      .forEach(box => box.checked = false);

  });


document.getElementById("doneSelection")
  .addEventListener("click", saveSelection);


updateSelectedCount();

</script>

</body>
</html>
