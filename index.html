<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="State Capitals">

<title>State Capitals</title>

<style>

/* =========================================
   COLORS
========================================= */

:root {

  --background: #f7f9fd;

  --navy: #0b225a;
  --navy-dark: #06163c;

  --blue: #0a62e8;
  --blue-2: #2f81f7;
  --blue-light: #eaf2ff;

  --red: #ef3d43;
  --red-light: #fff0f1;

  --text: #0b1838;
  --gray: #667086;
  --light-gray: #a7afbd;

  --white: #ffffff;

  --blue-border: #2d6fe8;
  --red-border: #ee5156;

}


/* =========================================
   GLOBAL
========================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  font-family:
    "Avenir Next",
    Avenir,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #fbfdff 0%,
      #f5f8fd 45%,
      #f7f9fc 100%
    );

  color: var(--text);

  user-select: none;
  -webkit-user-select: none;

  touch-action: manipulation;

  -webkit-text-size-adjust: 100%;
}

button {

  font-family: inherit;

  cursor: pointer;

  touch-action: manipulation;
}

.screen {

  display: none;

  width: 100%;
  height: 100%;

  padding:
    max(22px, env(safe-area-inset-top))
    20px
    max(20px, env(safe-area-inset-bottom));

}

.screen.active {
  display: flex;
}


/* =========================================
   HOME
========================================= */

#homeScreen {

  position: relative;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  overflow-y: auto;
}

.home-decoration {

  position: absolute;

  inset: 0;

  pointer-events: none;

  overflow: hidden;

  opacity: .9;
}

.star {

  position: absolute;

  color: #cfe0ff;

  font-size: 22px;
}

.star.one {
  top: 12%;
  left: 15%;
}

.star.two {
  top: 19%;
  right: 16%;
  font-size: 17px;
}

.star.three {
  top: 31%;
  left: 9%;
  font-size: 13px;
}

.star.four {
  top: 26%;
  right: 9%;
  font-size: 12px;
}

.flag-stripes {

  position: absolute;

  width: 250px;
  height: 180px;

  left: -90px;
  bottom: 3%;

  transform: rotate(-12deg);

  border-radius: 50%;

  opacity: .12;

  background:
    repeating-linear-gradient(
      0deg,
      var(--red) 0px,
      var(--red) 12px,
      transparent 12px,
      transparent 25px
    );
}

.blue-glow {

  position: absolute;

  width: 330px;
  height: 330px;

  top: -150px;
  right: -150px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(35,117,255,.13),
      rgba(35,117,255,0) 68%
    );
}

.home-content {

  position: relative;

  z-index: 2;

  width: 100%;
  max-width: 430px;

  display: flex;
  flex-direction: column;

  align-items: center;
}


/* LOGO */

.logo-circle {

  width: 76px;
  height: 76px;

  border: 2px solid var(--blue-border);

  border-radius: 24px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #edf4ff
    );

  display: flex;
  align-items: center;
  justify-content: center;

  margin-bottom: 20px;

  box-shadow:
    0 9px 22px rgba(20,70,150,.14);
}

.logo-inner {

  position: relative;

  width: 44px;
  height: 44px;

  border-radius: 15px;

  overflow: hidden;

  background:
    repeating-linear-gradient(
      0deg,
      var(--red) 0px,
      var(--red) 5px,
      white 5px,
      white 10px
    );
}

.logo-blue {

  position: absolute;

  left: 0;
  top: 0;

  width: 55%;
  height: 55%;

  background: var(--blue);

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;

  font-size: 17px;
}


/* TITLE */

.home-title {

  margin: 0;

  color: var(--navy);

  font-size: clamp(43px, 11.5vw, 59px);

  font-weight: 900;

  line-height: .98;

  letter-spacing: -2.1px;
}

.home-subtitle {

  margin-top: 18px;
  margin-bottom: 34px;

  color: var(--gray);

  font-size: 17px;

  line-height: 1.45;

  font-weight: 500;
}


/* START BUTTON */

.start-button {

  width: 100%;

  min-height: 72px;

  border: 2px solid #0049b9;

  border-radius: 21px;

  background:
    linear-gradient(
      180deg,
      #1673f2,
      #074cb9
    );

  color: white;

  font-size: 23px;
  font-weight: 800;

  letter-spacing: -.4px;

  box-shadow:
    0 12px 25px rgba(0,72,190,.22);

  margin-bottom: 18px;
}

.start-button:active {

  transform: scale(.985);

}


/* HOME CARDS */

.home-card {

  width: 100%;

  min-height: 92px;

  border: 1.8px solid var(--blue-border);

  border-radius: 20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.98),
      rgba(247,250,255,.96)
    );

  display: flex;

  align-items: center;

  padding: 14px 16px;

  margin-bottom: 14px;

  box-shadow:
    0 8px 20px rgba(20,40,80,.08);

  text-align: left;
}

.home-card.red-card {
  border-color: var(--red-border);
}

.card-icon {

  flex: 0 0 56px;

  width: 56px;
  height: 56px;

  border-radius: 16px;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-right: 15px;

  font-size: 27px;

  font-weight: 800;

  color: white;
}

.card-icon.blue {

  background:
    linear-gradient(
      145deg,
      #4b96ff,
      #0b5dde
    );

}

.card-icon.red {

  background:
    linear-gradient(
      145deg,
      #ff6b6b,
      #e9363d
    );

}

.card-text {

  flex: 1;

  min-width: 0;
}

.card-title {

  color: var(--navy);

  font-size: 19px;
  font-weight: 800;

  line-height: 1.1;
}

.card-subtitle {

  margin-top: 5px;

  color: var(--gray);

  font-size: 14px;

  font-weight: 500;
}

.card-arrow {

  color: var(--blue);

  font-size: 28px;
  font-weight: 600;

  margin-left: 10px;
}

.red-card .card-arrow {
  color: var(--red);
}


/* =========================================
   STUDY SCREEN
========================================= */

#studyScreen {

  position: relative;

  flex-direction: column;

  align-items: center;
}

.study-shell {

  width: 100%;
  max-width: 500px;

  height: 100%;

  display: flex;
  flex-direction: column;
}


/* TOP ROW */

.study-top {

  position: relative;

  width: 100%;

  min-height: 56px;

  display: flex;

  justify-content: center;
  align-items: center;
}

.mode-title {

  position: absolute;

  left: 0;

  padding: 8px 11px;

  border: 1.5px solid #ff9da1;

  border-radius: 999px;

  background: var(--red-light);

  color: var(--red);

  font-size: 11px;
  font-weight: 800;

  letter-spacing: .3px;
}

.counter {

  padding: 9px 18px;

  border: 1.5px solid #bdd1f8;

  border-radius: 999px;

  background: white;

  color: var(--navy);

  font-size: 17px;
  font-weight: 800;

  box-shadow:
    0 5px 13px rgba(40,50,80,.08);
}


/* MISSED BUTTON */

.missed-button {

  display: none;

  position: absolute;

  right: 0;

  height: 35px;

  padding: 0 13px;

  border: 1.5px solid #d82028;

  border-radius: 10px;

  background:
    linear-gradient(
      180deg,
      #ff565c,
      #e62d35
    );

  color: white;

  font-size: 13px;
  font-weight: 800;

  box-shadow:
    0 5px 11px rgba(220,40,40,.18);
}

.missed-button.visible {
  display: block;
}

.missed-button.already-missed {

  border-color: #717885;

  background: #858b96;
}


/* TAP AREA */

.study-tap-area {

  flex: 1;

  width: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  cursor: pointer;
}


/* STUDY CARD */

.study-card {

  position: relative;

  width: 100%;

  flex: 1;

  max-height: 570px;

  min-height: 350px;

  margin: 14px 0;

  border: 2px solid var(--blue-border);

  border-radius: 25px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.99),
      rgba(248,251,255,.96)
    );

  box-shadow:
    0 14px 28px rgba(20,50,100,.12);

  overflow: hidden;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;
}

.study-card::before {

  content: "";

  position: absolute;

  width: 220px;
  height: 220px;

  top: -105px;
  right: -85px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(37,116,237,.10),
      rgba(37,116,237,0)
    );

  pointer-events: none;
}

.study-card::after {

  content: "★";

  position: absolute;

  left: 20px;
  bottom: 18px;

  color: #e4edff;

  font-size: 27px;

  pointer-events: none;
}


/* STATE DISPLAY */

.state-display {

  position: relative;

  width: 100%;

  flex: 1;

  min-height: 260px;

  display: flex;

  align-items: center;
  justify-content: center;
}


/* STATE SILHOUETTE */

.state-outline {

  position: absolute;

  inset: 20px;

  display: flex;

  align-items: center;
  justify-content: center;

  opacity: .30;

  pointer-events: none;
}

.state-outline svg {

  width: 100%;
  height: 100%;

  max-width: 390px;
  max-height: 320px;

  overflow: visible;
}

.state-outline path {

  fill: #dce7f6;

  stroke: #648fd0;

  stroke-width: 2.2;

  vector-effect: non-scaling-stroke;
}


/* STATE NAME */

.state-name {

  position: relative;

  z-index: 2;

  padding: 0 20px;

  color: var(--navy-dark);

  font-size: clamp(42px, 12vw, 66px);

  font-weight: 900;

  line-height: 1;

  text-align: center;

  letter-spacing: -2px;

  text-shadow:
    0 0 14px rgba(255,255,255,.95),
    0 0 26px rgba(255,255,255,.82);
}


/* CAPITAL */

.capital-name {

  position: relative;

  z-index: 2;

  min-height: 62px;

  padding: 0 15px 24px;

  color: var(--blue);

  font-size: clamp(31px, 8vw, 45px);

  font-weight: 800;

  text-align: center;

  letter-spacing: -.6px;
}


/* TAP HINT */

.tap-hint {

  margin: 8px 0 18px;

  color: var(--blue);

  font-size: 16px;
  font-weight: 600;

  text-align: center;
}


/* =========================================
   NAVIGATION
========================================= */

.nav {

  width: 100%;

  padding-bottom: 2px;
}

.nav-row {

  display: flex;

  gap: 12px;
}

.nav button {

  min-height: 58px;

  border-radius: 17px;

  font-size: 17px;
  font-weight: 800;

  background: white;

  border: 1.8px solid var(--blue-border);

  color: var(--blue);

  box-shadow:
    0 7px 15px rgba(30,50,90,.09);
}

.nav-row button {

  flex: 1;
}

#nextButton {

  background:
    linear-gradient(
      180deg,
      #116bea,
      #084fc1
    );

  color: white;
}

.nav button:disabled {

  opacity: .25;

  background: white !important;

  color: var(--gray) !important;

  border-color: #bec5d1 !important;
}


/* HOME BUTTON */

.home-button {

  width: 100%;

  margin-top: 12px;

  background: white !important;

  color: var(--blue) !important;
}


/* CLEAR MISSED */

.clear-missed-button {

  display: none;

  width: 100%;

  margin-top: 12px;

  border-color: var(--red-border) !important;

  background: white !important;

  color: var(--red) !important;
}

.clear-missed-button.visible {
  display: block;
}


/* =========================================
   SELECT STATES
========================================= */

#selectionScreen {

  flex-direction: column;

  overflow-y: auto;

  -webkit-overflow-scrolling: touch;
}

.selection-header {

  position: sticky;

  top: 0;

  z-index: 10;

  padding-bottom: 14px;

  background: var(--background);
}

.selection-title {

  margin: 5px 0 18px;

  color: var(--navy);

  font-size: 34px;
  font-weight: 900;

  letter-spacing: -1px;
}

.selection-actions {

  display: flex;

  gap: 10px;
}

.selection-actions button {

  flex: 1;

  min-height: 46px;

  border: 1.5px solid var(--blue-border);

  border-radius: 13px;

  background: white;

  color: var(--blue);

  font-size: 15px;
  font-weight: 750;
}

#clearAll {

  color: var(--red);

  border-color: var(--red-border);
}


/* STATE LIST */

.state-list {

  display: grid;

  grid-template-columns: 1fr;

  gap: 9px;

  padding-bottom: 100px;
}

.state-option {

  display: flex;

  align-items: center;

  gap: 14px;

  min-height: 58px;

  padding: 12px 15px;

  border: 1px solid #d7e2f5;

  border-radius: 15px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #f9fbff
    );

  color: var(--navy);

  font-size: 17px;
  font-weight: 650;

  box-shadow:
    0 4px 10px rgba(20,40,80,.04);
}

.state-option input {

  width: 22px;
  height: 22px;

  accent-color: var(--blue);
}


/* DONE */

.done-button {

  position: fixed;

  left: 20px;
  right: 20px;

  bottom:
    max(
      20px,
      env(safe-area-inset-bottom)
    );

  min-height: 58px;

  border: 2px solid #0048bb;

  border-radius: 17px;

  background:
    linear-gradient(
      180deg,
      #126ced,
      #084fc4
    );

  color: white;

  font-size: 18px;
  font-weight: 800;

  box-shadow:
    0 9px 20px rgba(0,75,190,.20);
}


/* =========================================
   LANDSCAPE
========================================= */

@media (orientation: landscape) {

  body::before {

    content:
      "Please rotate your phone to portrait mode.";

    position: fixed;

    inset: 0;

    z-index: 99999;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 40px;

    background: var(--background);

    color: var(--navy);

    text-align: center;

    font-size: 24px;

    font-weight: 800;
  }

}


/* SMALLER PHONES */

@media (max-height: 720px) {

  .logo-circle {

    width: 58px;
    height: 58px;

    margin-bottom: 10px;
  }

  .logo-inner {

    width: 34px;
    height: 34px;
  }

  .logo-blue {

    font-size: 13px;
  }

  .home-title {

    font-size: 41px;
  }

  .home-subtitle {

    margin-top: 9px;
    margin-bottom: 17px;
  }

  .start-button {

    min-height: 58px;

    margin-bottom: 11px;
  }

  .home-card {

    min-height: 76px;

    margin-bottom: 9px;
  }

  .card-icon {

    width: 48px;
    height: 48px;

    flex-basis: 48px;
  }

}

</style>
</head>


<body>


<!-- =====================================
     HOME
===================================== -->

<div
  id="homeScreen"
  class="screen active"
>


  <div class="home-decoration">

    <div class="blue-glow"></div>

    <div class="flag-stripes"></div>

    <div class="star one">
      ★
    </div>

    <div class="star two">
      ★
    </div>

    <div class="star three">
      ★
    </div>

    <div class="star four">
      ★
    </div>

  </div>


  <div class="home-content">


    <div class="logo-circle">

      <div class="logo-inner">

        <div class="logo-blue">

      </div>

    </div>


    <h1 class="home-title">

      CAPITALS

    <div class="home-subtitle">

    </div>

        <div

      </div>

      <div class="card-arrow">
        ›
      </div>

    </div>

    <div

        <div

        </div>

      </div>

      <div class="card-arrow">
        ›
      </div>

    </div>


  </div>

</div>



<!-- =====================================
     STUDY
===================================== -->

<div
  id="studyScreen"
  class="screen"
>


  <div class="study-shell">


    <div class="study-top">


      <div
        class="mode-title"
        id="modeTitle"
      ></div>


      <div
        class="counter"
        id="counter"
      ></div>


      <button
        class="missed-button"
        id="missedButton"
      >
        Missed
      </button>


    </div>


    <div
      class="study-tap-area"
      id="studyTapArea"
    >


      <div class="study-card">


        <div class="state-display">


          <div
            class="state-outline"
            id="stateOutline"
          ></div>


          <div
            class="state-name"
            id="stateName"
          ></div>


        </div>


        <div
          class="capital-name"
          id="capitalName"
        ></div>


      </div>


      <div
        class="tap-hint"
        id="tapHint"
      >
        Tap to reveal capital
      </div>


    </div>


    <div class="nav">


      <div class="nav-row">


        <button
          id="previousButton"
        >
          ◀ Previous
        </button>


        <button
          id="nextButton"
        >
          Next ▶
        </button>


      </div>


      <button
        class="home-button"
        id="homeButton"
      >
        Home
      </button>


      <button
        class="clear-missed-button"
        id="clearMissedButton"
      >
        Clear Missed List
      </button>


    </div>


  </div>

</div>



<!-- =====================================
     CHOOSE STATES
===================================== -->

<div
  id="selectionScreen"
  class="screen"
>


  <div class="selection-header">


    <div class="selection-title">
      Choose States
    </div>


    <div class="selection-actions">


      <button id="selectAll">
        Select All
      </button>


      <button id="clearAll">
        Clear All
      </button>


    </div>


  </div>


  <div
    class="state-list"
    id="stateList"
  ></div>


  <button
    class="done-button"
    id="doneSelection"
  >
    Done
  </button>


</div>

  const mapModule =
    await import(
      "https://cdn.jsdelivr.net/npm/@svg-maps/usa@2.0.0/+esm"
    );


  usaMap =
    mapModule.default ||
    mapModule;


} catch (error) {

  console.log(
    "State outlines could not be loaded.",
    error
  );

}


/* =========================================
   SAVED STATES
========================================= */

let selectedStates;


let savedStateNames = null;


try {

  savedStateNames =
    JSON.parse(
      localStorage.getItem(
        "stateCapitalSelections"
      )
    );

} catch (error) {

  savedStateNames = null;

}


if (
  Array.isArray(savedStateNames) &&
  savedStateNames.length > 0
) {

  selectedStates =
    states.filter(
      function(state) {

        return savedStateNames.includes(
          state[0]
        );

      }
    );

} else {

  selectedStates =
    [...states];

}


/* =========================================
   MISSED
========================================= */

let missedStateNames = [];


try {

  const savedMissed =
    JSON.parse(
      localStorage.getItem(
        "stateCapitalMissed"
      )
    );


  if (
    Array.isArray(savedMissed)
  ) {

    missedStateNames =
      savedMissed;

  }

} catch (error) {

  missedStateNames = [];

}


/* =========================================
   VARIABLES
========================================= */

let studyOrder = [];

let currentIndex = 0;

let capitalVisible = false;

let studyMode =
  "normal";


/* =========================================
   ELEMENTS
========================================= */

const homeScreen =
  document.getElementById(
    "homeScreen"
  );


const studyScreen =
  document.getElementById(
    "studyScreen"
  );


const selectionScreen =
  document.getElementById(
    "selectionScreen"
  );


const stateName =
  document.getElementById(
    "stateName"
  );


const capitalName =
  document.getElementById(
    "capitalName"
  );


const counter =
  document.getElementById(
    "counter"
  );


const tapHint =
  document.getElementById(
    "tapHint"
  );


const studyTapArea =
  document.getElementById(
    "studyTapArea"
  );


const stateList =
  document.getElementById(
    "stateList"
  );


const selectedCount =
  document.getElementById(
    "selectedCount"
  );


const missedCount =
  document.getElementById(
    "missedCount"
  );


const reviewMissedTitle =
  document.getElementById(
    "reviewMissedTitle"
  );


const reviewMissedCard =
  document.getElementById(
    "reviewMissedCard"
  );


const missedButton =
  document.getElementById(
    "missedButton"
  );


const clearMissedButton =
  document.getElementById(
    "clearMissedButton"
  );


const modeTitle =
  document.getElementById(
    "modeTitle"
  );


const stateOutline =
  document.getElementById(
    "stateOutline"
  );


/* =========================================
   SCREEN
========================================= */

function showScreen(screen) {

  document
    .querySelectorAll(
      ".screen"
    )
    .forEach(
      function(item) {

        item.classList.remove(
          "active"
        );

      }
    );


  screen.classList.add(
    "active"
  );

}


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array) {

  const copy =
    [...array];


  for (
    let i = copy.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      copy[i],
      copy[j]
    ] = [
      copy[j],
      copy[i]
    ];

  }


  return copy;

}


/* =========================================
   STATE OUTLINE
========================================= */

function showStateOutline(
  state
) {

  stateOutline.innerHTML =
    "";


  if (
    !usaMap ||
    !Array.isArray(
      usaMap.locations
    )
  ) {

    return;

  }


  const location =
    usaMap.locations.find(
      function(item) {

        return (
          item.name.toLowerCase() ===
          state.toLowerCase()
        );

      }
    );


  if (
    !location
  ) {

    return;

  }


  const svgNS =
    "http://www.w3.org/2000/svg";


  const svg =
    document.createElementNS(
      svgNS,
      "svg"
    );


  const path =
    document.createElementNS(
      svgNS,
      "path"
    );


  path.setAttribute(
    "d",
    location.path
  );


  svg.appendChild(
    path
  );


  stateOutline.appendChild(
    svg
  );


  requestAnimationFrame(
    function() {

      try {

        const box =
          path.getBBox();


        const padding =
          Math.max(
            box.width,
            box.height
          ) * .10;


        svg.setAttribute(
          "viewBox",
          [
            box.x - padding,
            box.y - padding,
            box.width +
              padding * 2,
            box.height +
              padding * 2
          ].join(" ")
        );


        svg.setAttribute(
          "preserveAspectRatio",
          "xMidYMid meet"
        );


      } catch (error) {

        console.log(
          "Could not size state outline."
        );

      }

    }
  );

}


/* =========================================
   COUNTS
========================================= */

function updateSelectedCount() {

  selectedCount.textContent =
    selectedStates.length +
    " of 50 states selected";

}


function updateMissedCount() {

  const amount =
    missedStateNames.length;


  reviewMissedTitle.textContent =
    "Review Missed (" +
    amount +
    ")";


  if (
    amount === 1
  ) {

    missedCount.textContent =
      "1 missed capital saved";

  } else {

    missedCount.textContent =
      amount +
      " missed capitals saved";

  }


  if (
    amount === 0
  ) {

    reviewMissedCard.style.opacity =
      ".48";

  } else {

    reviewMissedCard.style.opacity =
      "1";

  }

}


/* =========================================
   SAVE
========================================= */

function saveSelectionsToStorage() {

  const names =
    selectedStates.map(
      function(state) {

        return state[0];

      }
    );


  localStorage.setItem(
    "stateCapitalSelections",
    JSON.stringify(
      names
    )
  );

}


function saveMissedToStorage() {

  localStorage.setItem(
    "stateCapitalMissed",
    JSON.stringify(
      missedStateNames
    )
  );


  updateMissedCount();

}


/* =========================================
   START STUDY
========================================= */

function startStudy() {

  if (
    selectedStates.length === 0
  ) {

    alert(
      "Please select at least one state."
    );

    return;

  }


  studyMode =
    "normal";


  studyOrder =
    shuffle(
      selectedStates
    );


  currentIndex =
    0;


  capitalVisible =
    false;


  showScreen(
    studyScreen
  );


  displayState();

}


/* =========================================
   MISSED STUDY
========================================= */

function startMissedStudy() {

  if (
    missedStateNames.length === 0
  ) {

    alert(
      "You do not have any missed capitals yet."
    );

    return;

  }


  const missedStates =
    states.filter(
      function(state) {

        return missedStateNames.includes(
          state[0]
        );

      }
    );


  studyMode =
    "missed";


  studyOrder =
    shuffle(
      missedStates
    );


  currentIndex =
    0;


  capitalVisible =
    false;


  showScreen(
    studyScreen
  );


  displayState();

}


/* =========================================
   DISPLAY STATE
========================================= */

function displayState() {

  if (
    studyOrder.length === 0
  ) {

    return;

  }


  const item =
    studyOrder[
      currentIndex
    ];


  stateName.textContent =
    item[0];


  showStateOutline(
    item[0]
  );


  counter.textContent =
    (currentIndex + 1) +
    " of " +
    studyOrder.length;


  if (
    studyMode ===
    "missed"
  ) {

    modeTitle.textContent =
      "REVIEWING MISSED";


    clearMissedButton
      .classList.add(
        "visible"
      );

  } else {

    modeTitle.textContent =
      "";


    clearMissedButton
      .classList.remove(
        "visible"
      );

  }


  if (
    capitalVisible
  ) {

    capitalName.textContent =
      item[1];


    missedButton
      .classList.add(
        "visible"
      );


    if (
      missedStateNames.includes(
        item[0]
      )
    ) {

      missedButton.textContent =
        "Missed ✓";


      missedButton
        .classList.add(
          "already-missed"
        );

    } else {

      missedButton.textContent =
        "Missed";


      missedButton
        .classList.remove(
          "already-missed"
        );

    }


    if (
      currentIndex <
      studyOrder.length - 1
    ) {

      tapHint.textContent =
        "Tap for next state";

    } else {

      tapHint.textContent =
        "End of round";

    }

  } else {

    capitalName.textContent =
      "";


    tapHint.textContent =
      "Tap to reveal capital";


    missedButton
      .classList.remove(
        "visible"
      );

  }


  document
    .getElementById(
      "previousButton"
    )
    .disabled =
      currentIndex === 0;


  document
    .getElementById(
      "nextButton"
    )
    .disabled =
      currentIndex ===
      studyOrder.length - 1;

}


/* =========================================
   MARK MISSED
========================================= */

function markMissed() {

  if (
    !capitalVisible ||
    studyOrder.length === 0
  ) {

    return;

  }


  const currentState =
    studyOrder[
      currentIndex
    ][0];


  if (
    !missedStateNames.includes(
      currentState
    )
  ) {

    missedStateNames.push(
      currentState
    );


    saveMissedToStorage();

  }


  missedButton.textContent =
    "Missed ✓";


  missedButton
    .classList.add(
      "already-missed"
    );

}


/* =========================================
   TAP
========================================= */

function handleStudyTap() {

  if (
    !capitalVisible
  ) {

    capitalVisible =
      true;


    displayState();


    return;

  }


  if (
    currentIndex <
    studyOrder.length - 1
  ) {

    currentIndex++;


    capitalVisible =
      false;


    displayState();

  }

}


/* =========================================
   NEXT
========================================= */

function nextState() {

  if (
    currentIndex <
    studyOrder.length - 1
  ) {

    currentIndex++;


    capitalVisible =
      false;


    displayState();

  }

}


/* =========================================
   PREVIOUS
========================================= */

function previousState() {

  if (
    currentIndex > 0
  ) {

    currentIndex--;


    capitalVisible =
      false;


    displayState();

  }

}


/* =========================================
   CLEAR MISSED
========================================= */

function clearMissedList() {

  if (
    missedStateNames.length === 0
  ) {

    return;

  }


  const shouldClear =
    confirm(
      "Clear your entire missed capitals list?"
    );


  if (
    !shouldClear
  ) {

    return;

  }


  missedStateNames =
    [];


  saveMissedToStorage();


  studyOrder =
    [];


  currentIndex =
    0;


  capitalVisible =
    false;


  showScreen(
    homeScreen
  );

}


/* =========================================
   BUILD SELECTION
========================================= */

function buildStateSelection() {

  stateList.innerHTML =
    "";


  states.forEach(
    function(
      item,
      index
    ) {


      const label =
        document.createElement(
          "label"
        );


      label.className =
        "state-option";


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.dataset.index =
        index;


      checkbox.checked =
        selectedStates.some(
          function(state) {

            return (
              state[0] ===
              item[0]
            );

          }
        );


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        item[0];


      label.appendChild(
        checkbox
      );


      label.appendChild(
        text
      );


      stateList.appendChild(
        label
      );

    }
  );

}


/* =========================================
   SAVE SELECTION
========================================= */

function saveSelection() {

  const checkboxes =
    stateList.querySelectorAll(
      "input[type='checkbox']"
    );


  const newSelection =
    [];


  checkboxes.forEach(
    function(box) {

      if (
        box.checked
      ) {

        newSelection.push(
          states[
            Number(
              box.dataset.index
            )
          ]
        );

      }

    }
  );


  if (
    newSelection.length === 0
  ) {

    alert(
      "Please select at least one state."
    );

    return;

  }


  selectedStates =
    newSelection;


  saveSelectionsToStorage();


  updateSelectedCount();


  showScreen(
    homeScreen
  );

}


/* =========================================
   EVENTS
========================================= */

document
  .getElementById(
    "startArea"
  )
  .addEventListener(
    "click",
    startStudy
  );


document
  .getElementById(
    "chooseStates"
  )
  .addEventListener(
    "click",
    function() {

      buildStateSelection();


      showScreen(
        selectionScreen
      );

    }
  );


reviewMissedCard
  .addEventListener(
    "click",
    startMissedStudy
  );


studyTapArea
  .addEventListener(
    "click",
    handleStudyTap
  );


missedButton
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();


      markMissed();

    }
  );


document
  .getElementById(
    "nextButton"
  )
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();


      nextState();

    }
  );


document
  .getElementById(
    "previousButton"
  )
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();


      previousState();

    }
  );


document
  .getElementById(
    "homeButton"
  )
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();


      updateMissedCount();


      showScreen(
        homeScreen
      );

    }
  );


clearMissedButton
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();


      clearMissedList();

    }
  );


document
  .getElementById(
    "selectAll"
  )
  .addEventListener(
    "click",
    function() {

      stateList
        .querySelectorAll(
          "input"
        )
        .forEach(
          function(box) {

            box.checked =
              true;

          }
        );

    }
  );


document
  .getElementById(
    "clearAll"
  )
  .addEventListener(
    "click",
    function() {

      stateList
        .querySelectorAll(
          "input"
        )
        .forEach(
          function(box) {

            box.checked =
              false;

          }
        );

    }
  );


document
  .getElementById(
    "doneSelection"
  )
  .addEventListener(
    "click",
    saveSelection
  );


/* =========================================
   INITIALIZE
========================================= */

updateSelectedCount();

updateMissedCount();


</script>

</body>
</html>
