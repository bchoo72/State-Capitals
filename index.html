<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="State Capitals">

<title>State Capitals</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f4f4f7;
  color: #111;

  user-select: none;
  -webkit-user-select: none;

  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}

button {
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

.screen {
  display: none;

  width: 100%;
  height: 100%;

  padding:
    max(24px, env(safe-area-inset-top))
    22px
    max(24px, env(safe-area-inset-bottom));
}

.screen.active {
  display: flex;
}


/* HOME SCREEN */

#homeScreen {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.home-title {
  font-size: 38px;
  font-weight: 800;
  margin-bottom: 38px;
}

.tap-start {
  width: 100%;
  max-width: 500px;
  padding: 35px;
  font-size: 27px;
  font-weight: 650;
  cursor: pointer;
}

.choose-button,
.missed-review-button {
  width: 100%;
  max-width: 320px;
  margin-top: 16px;
  padding: 15px 26px;

  border: none;
  border-radius: 14px;

  background: white;

  font-size: 18px;
  font-weight: 650;

  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.missed-review-button {
  background: #333;
  color: white;
}

.missed-review-button:disabled {
  opacity: .35;
}

.selected-count,
.missed-count {
  margin-top: 12px;
  font-size: 15px;
  color: #666;
}


/* STUDY SCREEN */

#studyScreen {
  flex-direction: column;
  align-items: center;
}


/* TOP AREA */

.study-top {
  width: 100%;
  max-width: 600px;

  min-height: 46px;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;
}

.mode-title {
  text-align: center;

  font-size: 13px;
  font-weight: 700;

  color: #888;

  padding: 0 90px;
}


/* SMALL MISSED BUTTON */

.missed-button {
  display: none;

  position: absolute;

  right: 0;
  top: 0;

  min-width: 76px;
  height: 36px;

  padding: 0 12px;

  border: none;
  border-radius: 10px;

  background: #c94444;

  color: white;

  font-size: 14px;
  font-weight: 700;

  box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

.missed-button.visible {
  display: block;
}

.missed-button.already-missed {
  background: #777;
}


.counter {
  width: 100%;

  text-align: center;

  padding-top: 2px;

  font-size: 18px;

  color: #666;

  pointer-events: none;
}


/* MAIN STUDY AREA */

.study-tap-area {
  flex: 1;

  width: 100%;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  cursor: pointer;

  touch-action: manipulation;
}


/* STATE DISPLAY */

.state-display {
  position: relative;

  width: 100%;
  max-width: 520px;

  min-height: 240px;

  display: flex;
  align-items: center;
  justify-content: center;
}


/* STATE OUTLINE */

.state-outline {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  width: min(82vw, 390px);
  height: 220px;

  opacity: .30;

  pointer-events: none;

  z-index: 0;
}

.state-outline svg {
  display: block;

  width: 100%;
  height: 100%;

  overflow: visible;
}

.state-outline path {
  fill: #b8b8be;
  stroke: #777;
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}


/* STATE NAME */

.state-name {
  position: relative;

  z-index: 2;

  padding: 0 10px;

  font-size: clamp(40px, 11vw, 68px);

  font-weight: 800;

  line-height: 1.1;

  text-shadow:
    0 1px 2px rgba(244,244,247,.9),
    0 0 10px rgba(244,244,247,.85);
}


/* CAPITAL */

.capital-name {
  min-height: 60px;

  margin-top: 5px;

  font-size: clamp(30px, 8vw, 48px);

  font-weight: 500;

  color: #555;
}

.tap-hint {
  margin-top: 30px;

  font-size: 15px;

  color: #999;
}


/* NAVIGATION */

.nav {
  width: 100%;
  max-width: 600px;

  padding-bottom: 6px;
}

.nav-row {
  display: flex;

  gap: 12px;

  width: 100%;
}

.nav button {
  padding: 16px 8px;

  border: none;
  border-radius: 14px;

  background: white;

  font-size: 17px;
  font-weight: 650;

  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.nav-row button {
  flex: 1;
}

.home-button {
  width: 100%;

  margin-top: 12px;

  background: #e3e3e8 !important;
}

.clear-missed-button {
  display: none;

  width: 100%;

  margin-top: 12px;

  background: #c94444 !important;

  color: white;
}

.clear-missed-button.visible {
  display: block;
}

.nav button:disabled {
  opacity: .35;
}


/* CHOOSE STATES SCREEN */

#selectionScreen {
  flex-direction: column;

  overflow-y: auto;

  -webkit-overflow-scrolling: touch;
}

.selection-header {
  position: sticky;

  top: 0;

  z-index: 10;

  background: #f4f4f7;

  padding-bottom: 12px;
}

.selection-title {
  margin: 0 0 16px;

  font-size: 30px;

  font-weight: 800;
}

.selection-actions {
  display: flex;

  gap: 10px;
}

.selection-actions button {
  flex: 1;

  padding: 12px;

  border: none;
  border-radius: 12px;

  background: white;

  font-size: 16px;
  font-weight: 650;
}

.state-list {
  display: grid;

  grid-template-columns: 1fr;

  gap: 8px;

  padding-bottom: 110px;
}

.state-option {
  display: flex;

  align-items: center;

  gap: 14px;

  padding: 15px;

  background: white;

  border-radius: 12px;

  font-size: 18px;
}

.state-option input {
  width: 23px;
  height: 23px;
}

.done-button {
  position: fixed;

  left: 22px;
  right: 22px;

  bottom: max(22px, env(safe-area-inset-bottom));

  padding: 16px;

  border: none;
  border-radius: 14px;

  background: #111;

  color: white;

  font-size: 18px;
  font-weight: 700;
}


/* PORTRAIT ONLY */

@media (orientation: landscape) {

  body::before {
    content: "Please rotate your phone to portrait mode.";

    position: fixed;

    inset: 0;

    z-index: 99999;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 40px;

    background: #f4f4f7;

    text-align: center;

    font-size: 24px;

    font-weight: 700;
  }
}

</style>
</head>

<body>


<!-- HOME SCREEN -->

<div id="homeScreen" class="screen active">

  <div class="home-title">
    U.S. State Capitals
  </div>

  <div
    class="tap-start"
    id="startArea"
  >
    Tap to Start
  </div>

  <button
    class="choose-button"
    id="chooseStates"
  >
    Choose States
  </button>

  <div
    class="selected-count"
    id="selectedCount"
  ></div>

  <button
    class="missed-review-button"
    id="reviewMissedButton"
  >
    Review Missed
  </button>

  <div
    class="missed-count"
    id="missedCount"
  ></div>

</div>


<!-- STUDY SCREEN -->

<div id="studyScreen" class="screen">


  <div class="study-top">

    <div
      class="mode-title"
      id="modeTitle"
    ></div>

    <button
      class="missed-button"
      id="missedButton"
    >
      Missed
    </button>

  </div>


  <div
    class="counter"
    id="counter"
  ></div>


  <div
    class="study-tap-area"
    id="studyTapArea"
  >


    <div class="state-display">


      <div
        class="state-outline"
        id="stateOutline"
      ></div>


      <div
        class="state-name"
        id="stateName"
      ></div>


    </div>


    <div
      class="capital-name"
      id="capitalName"
    ></div>


    <div
      class="tap-hint"
      id="tapHint"
    >
      Tap to reveal capital
    </div>


  </div>


  <div class="nav">

    <div class="nav-row">

      <button id="previousButton">
        ◀ Previous
      </button>

      <button id="nextButton">
        Next ▶
      </button>

    </div>


    <button
      class="home-button"
      id="homeButton"
    >
      Home
    </button>


    <button
      class="clear-missed-button"
      id="clearMissedButton"
    >
      Clear Missed List
    </button>

  </div>

</div>


<!-- CHOOSE STATES -->

<div id="selectionScreen" class="screen">

  <div class="selection-header">

    <div class="selection-title">
      Choose States
    </div>

    <div class="selection-actions">

      <button id="selectAll">
        Select All
      </button>

      <button id="clearAll">
        Clear All
      </button>

    </div>

  </div>

  <div
    class="state-list"
    id="stateList"
  ></div>

  <button
    class="done-button"
    id="doneSelection"
  >
    Done
  </button>

</div>


<script type="module">


/* STATES AND CAPITALS */

const states = [

  ["Alabama", "Montgomery"],
  ["Alaska", "Juneau"],
  ["Arizona", "Phoenix"],
  ["Arkansas", "Little Rock"],
  ["California", "Sacramento"],
  ["Colorado", "Denver"],
  ["Connecticut", "Hartford"],
  ["Delaware", "Dover"],
  ["Florida", "Tallahassee"],
  ["Georgia", "Atlanta"],
  ["Hawaii", "Honolulu"],
  ["Idaho", "Boise"],
  ["Illinois", "Springfield"],
  ["Indiana", "Indianapolis"],
  ["Iowa", "Des Moines"],
  ["Kansas", "Topeka"],
  ["Kentucky", "Frankfort"],
  ["Louisiana", "Baton Rouge"],
  ["Maine", "Augusta"],
  ["Maryland", "Annapolis"],
  ["Massachusetts", "Boston"],
  ["Michigan", "Lansing"],
  ["Minnesota", "Saint Paul"],
  ["Mississippi", "Jackson"],
  ["Missouri", "Jefferson City"],
  ["Montana", "Helena"],
  ["Nebraska", "Lincoln"],
  ["Nevada", "Carson City"],
  ["New Hampshire", "Concord"],
  ["New Jersey", "Trenton"],
  ["New Mexico", "Santa Fe"],
  ["New York", "Albany"],
  ["North Carolina", "Raleigh"],
  ["North Dakota", "Bismarck"],
  ["Ohio", "Columbus"],
  ["Oklahoma", "Oklahoma City"],
  ["Oregon", "Salem"],
  ["Pennsylvania", "Harrisburg"],
  ["Rhode Island", "Providence"],
  ["South Carolina", "Columbia"],
  ["South Dakota", "Pierre"],
  ["Tennessee", "Nashville"],
  ["Texas", "Austin"],
  ["Utah", "Salt Lake City"],
  ["Vermont", "Montpelier"],
  ["Virginia", "Richmond"],
  ["Washington", "Olympia"],
  ["West Virginia", "Charleston"],
  ["Wisconsin", "Madison"],
  ["Wyoming", "Cheyenne"]

];


/* LOAD STATE OUTLINE DATA */

let usaMap = null;

try {

  const module =
    await import(
      "https://cdn.jsdelivr.net/npm/@svg-maps/usa@2.0.0/+esm"
    );

  usaMap =
    module.default || module;

} catch (error) {

  console.log(
    "State outline map could not be loaded.",
    error
  );

}


/* LOAD SAVED STATE SELECTIONS */

let selectedStates;

const savedStateNames =
  JSON.parse(
    localStorage.getItem(
      "stateCapitalSelections"
    )
  );

if (
  Array.isArray(savedStateNames) &&
  savedStateNames.length > 0
) {

  selectedStates =
    states.filter(
      function(state) {

        return savedStateNames.includes(
          state[0]
        );

      }
    );

} else {

  selectedStates =
    [...states];

}


/* LOAD MISSED STATES */

let missedStateNames =
  JSON.parse(
    localStorage.getItem(
      "stateCapitalMissed"
    )
  );

if (
  !Array.isArray(missedStateNames)
) {

  missedStateNames = [];

}


/* VARIABLES */

let studyOrder = [];

let currentIndex = 0;

let capitalVisible = false;

let studyMode = "normal";


/* ELEMENTS */

const homeScreen =
  document.getElementById(
    "homeScreen"
  );

const studyScreen =
  document.getElementById(
    "studyScreen"
  );

const selectionScreen =
  document.getElementById(
    "selectionScreen"
  );

const stateName =
  document.getElementById(
    "stateName"
  );

const capitalName =
  document.getElementById(
    "capitalName"
  );

const counter =
  document.getElementById(
    "counter"
  );

const tapHint =
  document.getElementById(
    "tapHint"
  );

const studyTapArea =
  document.getElementById(
    "studyTapArea"
  );

const stateList =
  document.getElementById(
    "stateList"
  );

const selectedCount =
  document.getElementById(
    "selectedCount"
  );

const missedCount =
  document.getElementById(
    "missedCount"
  );

const missedButton =
  document.getElementById(
    "missedButton"
  );

const reviewMissedButton =
  document.getElementById(
    "reviewMissedButton"
  );

const clearMissedButton =
  document.getElementById(
    "clearMissedButton"
  );

const modeTitle =
  document.getElementById(
    "modeTitle"
  );

const stateOutline =
  document.getElementById(
    "stateOutline"
  );


/* SHOW SCREEN */

function showScreen(screen) {

  document
    .querySelectorAll(".screen")
    .forEach(
      function(s) {

        s.classList.remove(
          "active"
        );

      }
    );

  screen.classList.add(
    "active"
  );

}


/* SHUFFLE */

function shuffle(array) {

  const copy = [...array];

  for (
    let i = copy.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      copy[i],
      copy[j]
    ] = [
      copy[j],
      copy[i]
    ];

  }

  return copy;

}


/* SHOW STATE OUTLINE */

function showStateOutline(state) {

  stateOutline.innerHTML = "";

  if (
    !usaMap ||
    !Array.isArray(usaMap.locations)
  ) {

    return;

  }


  const location =
    usaMap.locations.find(
      function(item) {

        return (
          item.name.toLowerCase() ===
          state.toLowerCase()
        );

      }
    );


  if (
    !location
  ) {

    return;

  }


  const svgNS =
    "http://www.w3.org/2000/svg";


  const svg =
    document.createElementNS(
      svgNS,
      "svg"
    );


  const path =
    document.createElementNS(
      svgNS,
      "path"
    );


  path.setAttribute(
    "d",
    location.path
  );


  svg.appendChild(
    path
  );


  stateOutline.appendChild(
    svg
  );


  requestAnimationFrame(
    function() {

      try {

        const box =
          path.getBBox();


        const padding =
          Math.max(
            box.width,
            box.height
          ) * .10;


        svg.setAttribute(
          "viewBox",
          [
            box.x - padding,
            box.y - padding,
            box.width + padding * 2,
            box.height + padding * 2
          ].join(" ")
        );


        svg.setAttribute(
          "preserveAspectRatio",
          "xMidYMid meet"
        );

      } catch (error) {

        console.log(
          "Could not size state outline."
        );

      }

    }
  );

}


/* UPDATE SELECTED COUNT */

function updateSelectedCount() {

  selectedCount.textContent =
    selectedStates.length +
    " of 50 states selected";

}


/* UPDATE MISSED COUNT */

function updateMissedCount() {

  const amount =
    missedStateNames.length;


  missedCount.textContent =
    amount === 1
      ? "1 missed capital saved"
      : amount +
        " missed capitals saved";


  reviewMissedButton.textContent =
    "Review Missed (" +
    amount +
    ")";


  reviewMissedButton.disabled =
    amount === 0;

}


/* SAVE SELECTIONS */

function saveSelectionsToStorage() {

  const names =
    selectedStates.map(
      function(state) {

        return state[0];

      }
    );


  localStorage.setItem(
    "stateCapitalSelections",
    JSON.stringify(names)
  );

}


/* SAVE MISSED */

function saveMissedToStorage() {

  localStorage.setItem(
    "stateCapitalMissed",
    JSON.stringify(
      missedStateNames
    )
  );

  updateMissedCount();

}


/* START NORMAL STUDY */

function startStudy() {

  if (
    selectedStates.length === 0
  ) {

    alert(
      "Please select at least one state."
    );

    return;

  }


  studyMode =
    "normal";


  studyOrder =
    shuffle(
      selectedStates
    );


  currentIndex = 0;

  capitalVisible = false;


  showScreen(
    studyScreen
  );


  displayState();

}


/* START MISSED STUDY */

function startMissedStudy() {

  if (
    missedStateNames.length === 0
  ) {

    alert(
      "You do not have any missed capitals yet."
    );

    return;

  }


  const missedStates =
    states.filter(
      function(state) {

        return missedStateNames.includes(
          state[0]
        );

      }
    );


  studyMode =
    "missed";


  studyOrder =
    shuffle(
      missedStates
    );


  currentIndex = 0;

  capitalVisible = false;


  showScreen(
    studyScreen
  );


  displayState();

}


/* DISPLAY STATE */

function displayState() {

  if (
    studyOrder.length === 0
  ) {

    return;

  }


  const item =
    studyOrder[
      currentIndex
    ];


  stateName.textContent =
    item[0];


  showStateOutline(
    item[0]
  );


  if (
    studyMode ===
    "missed"
  ) {

    modeTitle.textContent =
      "REVIEWING MISSED";


    clearMissedButton
      .classList.add(
        "visible"
      );

  } else {

    modeTitle.textContent =
      "";


    clearMissedButton
      .classList.remove(
        "visible"
      );

  }


  if (
    capitalVisible
  ) {

    capitalName.textContent =
      item[1];


    missedButton
      .classList.add(
        "visible"
      );


    if (
      missedStateNames.includes(
        item[0]
      )
    ) {

      missedButton.textContent =
        "Missed ✓";


      missedButton
        .classList.add(
          "already-missed"
        );

    } else {

      missedButton.textContent =
        "Missed";


      missedButton
        .classList.remove(
          "already-missed"
        );

    }


    if (
      currentIndex <
      studyOrder.length - 1
    ) {

      tapHint.textContent =
        "Tap for next state";

    } else {

      tapHint.textContent =
        "End of round";

    }

  } else {

    capitalName.textContent =
      "";


    tapHint.textContent =
      "Tap to reveal capital";


    missedButton
      .classList.remove(
        "visible"
      );

  }


  counter.textContent =
    (currentIndex + 1) +
    " of " +
    studyOrder.length;


  document
    .getElementById(
      "previousButton"
    )
    .disabled =
      currentIndex === 0;


  document
    .getElementById(
      "nextButton"
    )
    .disabled =
      currentIndex ===
      studyOrder.length - 1;

}


/* MARK MISSED */

function markMissed() {

  if (
    !capitalVisible ||
    studyOrder.length === 0
  ) {

    return;

  }


  const currentState =
    studyOrder[
      currentIndex
    ][0];


  if (
    !missedStateNames.includes(
      currentState
    )
  ) {

    missedStateNames.push(
      currentState
    );


    saveMissedToStorage();

  }


  missedButton.textContent =
    "Missed ✓";


  missedButton
    .classList.add(
      "already-missed"
    );

}


/* STUDY TAP */

function handleStudyTap() {

  if (
    !capitalVisible
  ) {

    capitalVisible = true;

    displayState();

    return;

  }


  if (
    currentIndex <
    studyOrder.length - 1
  ) {

    currentIndex++;

    capitalVisible = false;

    displayState();

  }

}


/* NEXT */

function nextState() {

  if (
    currentIndex <
    studyOrder.length - 1
  ) {

    currentIndex++;

    capitalVisible = false;

    displayState();

  }

}


/* PREVIOUS */

function previousState() {

  if (
    currentIndex > 0
  ) {

    currentIndex--;

    capitalVisible = false;

    displayState();

  }

}


/* CLEAR MISSED */

function clearMissedList() {

  if (
    missedStateNames.length === 0
  ) {

    return;

  }


  const shouldClear =
    confirm(
      "Clear your entire missed capitals list?"
    );


  if (
    !shouldClear
  ) {

    return;

  }


  missedStateNames = [];


  saveMissedToStorage();


  studyOrder = [];

  currentIndex = 0;

  capitalVisible = false;


  showScreen(
    homeScreen
  );

}


/* BUILD STATE SELECTION */

function buildStateSelection() {

  stateList.innerHTML =
    "";


  states.forEach(
    function(item, index) {

      const label =
        document.createElement(
          "label"
        );


      label.className =
        "state-option";


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";


      checkbox.dataset.index =
        index;


      checkbox.checked =
        selectedStates.some(
          function(state) {

            return (
              state[0] ===
              item[0]
            );

          }
        );


      const text =
        document.createElement(
          "span"
        );


      text.textContent =
        item[0];


      label.appendChild(
        checkbox
      );


      label.appendChild(
        text
      );


      stateList.appendChild(
        label
      );

    }
  );

}


/* SAVE SELECTION */

function saveSelection() {

  const checkboxes =
    stateList.querySelectorAll(
      "input[type='checkbox']"
    );


  const newSelection =
    [];


  checkboxes.forEach(
    function(box) {

      if (
        box.checked
      ) {

        newSelection.push(
          states[
            Number(
              box.dataset.index
            )
          ]
        );

      }

    }
  );


  if (
    newSelection.length === 0
  ) {

    alert(
      "Please select at least one state."
    );

    return;

  }


  selectedStates =
    newSelection;


  saveSelectionsToStorage();


  updateSelectedCount();


  showScreen(
    homeScreen
  );

}


/* START */

document
  .getElementById(
    "startArea"
  )
  .addEventListener(
    "click",
    startStudy
  );


/* REVIEW MISSED */

reviewMissedButton
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      startMissedStudy();

    }
  );


/* STUDY AREA */

studyTapArea
  .addEventListener(
    "click",
    handleStudyTap
  );


/* MISSED BUTTON */

missedButton
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      markMissed();

    }
  );


/* NEXT */

document
  .getElementById(
    "nextButton"
  )
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      nextState();

    }
  );


/* PREVIOUS */

document
  .getElementById(
    "previousButton"
  )
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      previousState();

    }
  );


/* HOME */

document
  .getElementById(
    "homeButton"
  )
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();


      showScreen(
        homeScreen
      );


      updateMissedCount();

    }
  );


/* CLEAR MISSED */

clearMissedButton
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      clearMissedList();

    }
  );


/* CHOOSE STATES */

document
  .getElementById(
    "chooseStates"
  )
  .addEventListener(
    "click",
    function(event) {

      event.stopPropagation();


      buildStateSelection();


      showScreen(
        selectionScreen
      );

    }
  );


/* SELECT ALL */

document
  .getElementById(
    "selectAll"
  )
  .addEventListener(
    "click",
    function() {

      stateList
        .querySelectorAll(
          "input"
        )
        .forEach(
          function(box) {

            box.checked =
              true;

          }
        );

    }
  );


/* CLEAR ALL */

document
  .getElementById(
    "clearAll"
  )
  .addEventListener(
    "click",
    function() {

      stateList
        .querySelectorAll(
          "input"
        )
        .forEach(
          function(box) {

            box.checked =
              false;

          }
        );

    }
  );


/* DONE */

document
  .getElementById(
    "doneSelection"
  )
  .addEventListener(
    "click",
    saveSelection
  );


/* INITIALIZE */

updateSelectedCount();

updateMissedCount();

</script>

</body>
</html>
